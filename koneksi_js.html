
<script>

let CURRENT_USER_CONTEXT = null;


/* =========================================================
   SHOW RESULT
   ========================================================= */

function showResult(value) {

  const el =
    document.getElementById(
      'result'
    );

  if (!el) return;


  el.textContent =
    typeof value === 'string'
      ? value
      : JSON.stringify(
          value,
          null,
          2
        );

}


/* =========================================================
   BUTTON LOADING
   ========================================================= */

function setButtonLoading(
  id,
  loading,
  text
) {

  const btn =
    document.getElementById(
      id
    );


  if (!btn) return;


  btn.disabled =
    loading;


  if (loading) {

    btn.dataset.oldText =
      btn.innerHTML;


    btn.innerHTML =
      '<span class="spinner-border spinner-border-sm me-2"></span>' +
      text;

  }
  else {

    btn.innerHTML =
      btn.dataset.oldText ||
      text;

  }

}


/* =========================================================
   LOAD APPLICATION
   ========================================================= */

function loadApplication() {

  console.log(
    'SIM SATRIA: loadApplication()'
  );


  google.script.run

    .withSuccessHandler(
      function(result) {

        console.log(
          'getLoginInfo() result:',
          result
        );


        if (
          !result ||
          !result.success
        ) {

          showLoginError(

            result &&
            result.message
              ? result.message
              : 'Autentikasi gagal.'

          );

          return;

        }


        /*
         * ===============================================
         * SIMPAN CONTEXT
         * ===============================================
         */

        CURRENT_USER_CONTEXT =
          result;


        /*
         * ===============================================
         * SEKOLAH
         * ===============================================
         */

        const schoolName =
          document.getElementById(
            'schoolName'
          );


        if (schoolName) {

          schoolName.textContent =
            result.school &&
            result.school.namaSekolah
              ? result.school.namaSekolah
              : '-';

        }


        /*
         * ===============================================
         * NPSN
         * ===============================================
         */

        const schoolNpsn =
          document.getElementById(
            'schoolNpsn'
          );


        if (schoolNpsn) {

          schoolNpsn.textContent =
            result.school &&
            result.school.npsn
              ? result.school.npsn
              : '-';

        }


        /*
         * ===============================================
         * USER
         * ===============================================
         */

        const userName =
          document.getElementById(
            'userName'
          );


        if (userName) {

          userName.textContent =
            result.user &&
            result.user.nama
              ? result.user.nama
              : '-';

        }


        /*
         * ===============================================
         * ROLE
         * ===============================================
         */

        const userRole =
          document.getElementById(
            'userRole'
          );


        if (userRole) {

          userRole.textContent =
            result.user &&
            result.user.role
              ? result.user.role
              : '-';

        }


        /*
         * ===============================================
         * EMAIL
         * ===============================================
         */

        const userEmail =
          document.getElementById(
            'userEmail'
          );


        if (userEmail) {

          userEmail.textContent =
            result.user &&
            result.user.email
              ? result.user.email
              : '-';

        }


        /*
         * ===============================================
         * STATUS
         * ===============================================
         */

        const loadingText =
          document.getElementById(
            'loadingText'
          );


        if (loadingText) {

          loadingText.textContent =
            'Terhubung';

        }


        console.log(
          'School Context berhasil ditampilkan.'
        );

      }
    )

    .withFailureHandler(
      function(error) {

        console.error(
          'getLoginInfo() ERROR:',
          error
        );


        showLoginError(

          error &&
          error.message
            ? error.message
            : 'Gagal memperoleh informasi login.'

        );

      }
    )

    .getLoginInfo();

}


/* =========================================================
   LOGIN ERROR
   ========================================================= */

function showLoginError(
  message
) {

  const loadingText =
    document.getElementById(
      'loadingText'
    );


  if (loadingText) {

    loadingText.textContent =
      'Gagal terhubung';

  }


  const el =
    document.getElementById(
      'loginError'
    );


  if (!el) {

    console.error(
      'loginError element tidak ditemukan:',
      message
    );

    return;

  }


  el.textContent =
    message ||
    'Terjadi kesalahan.';


  el.classList.remove(
    'hidden'
  );

}


/* =========================================================
   TEST SCHOOL RESOURCES
   ========================================================= */

function testResources() {

  setButtonLoading(
    'btnResource',
    true,
    'Testing...'
  );


  google.script.run

    .withSuccessHandler(
      function(result) {

        setButtonLoading(
          'btnResource',
          false,
          'TEST SCHOOL RESOURCES'
        );


        showResult(
          result
        );

      }
    )

    .withFailureHandler(
      function(error) {

        setButtonLoading(
          'btnResource',
          false,
          'TEST SCHOOL RESOURCES'
        );


        showResult({

          success:
            false,

          error:
            error &&
            error.message
              ? error.message
              : 'Testing resources gagal.'

        });

      }
    )

    .testSchoolResources();

}

/* =========================================================
   REFRESH SCHOOL CONTEXT
   ========================================================= */

function refreshSchoolContext() {

  const btn =
    document.getElementById(
      'btnRefreshContext'
    );


  if (!btn) return;


  btn.disabled =
    true;


  btn.innerHTML =
    '<span class="spinner-border spinner-border-sm me-2"></span>' +
    'Refreshing...';


  google.script.run

    .withSuccessHandler(
      function(result) {

        btn.disabled =
          false;


        btn.innerHTML =
          'REFRESH SCHOOL CONTEXT';


        showResult(
          result
        );


        /*
         * Reload halaman supaya frontend
         * menggunakan School Context terbaru.
         */

        setTimeout(
          function() {

            location.reload();

          },
          1000
        );

      }
    )

    .withFailureHandler(
      function(error) {

        btn.disabled =
          false;


        btn.innerHTML =
          'REFRESH SCHOOL CONTEXT';


        showResult({

          success:
            false,

          error:
            error &&
            error.message
              ? error.message
              : 'Refresh School Context gagal.'

        });

      }
    )

    .refreshMySchoolContext();

}


/* =========================================================
   INIT HALAMAN KONEKSI
   =========================================================
   
   PENTING:
   Halaman ini dimasukkan secara dinamis ke #content.
   
   Karena itu JANGAN menggunakan:
   
   document.addEventListener(
     'DOMContentLoaded',
     loadApplication
   );
   
   karena DOMContentLoaded sudah terjadi.
   
   Kita panggil langsung.
   ========================================================= */

function initKoneksiPage() {

}

<style>

/* =========================================================
   ROOT
   ========================================================= */

:root {

  --satria-primary: #0B3D2E;

  --satria-secondary: #2E7D32;

  --satria-bg: #F4F8F5;

  --satria-text: #17352A;

  --satria-muted: #718078;

  --satria-border: #E2EBE5;

}


/* =========================================================
   GLOBAL
   ========================================================= */

* {

  box-sizing: border-box;

}


body {

  margin: 0;

  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #F4F8F5 0%,
      #EEF6F0 100%
    );

  color: var(--satria-text);

  min-height: 100vh;

}


/* =========================================================
   APP SHELL
   ========================================================= */

.app-shell {

  min-height: 100vh;

  display: flex;

  flex-direction: column;

}


/* =========================================================
   TOPBAR
   ========================================================= */

.topbar {

  height: 72px;

  padding:
    0 28px;

  display: flex;

  align-items: center;

  justify-content: space-between;

  background:
    linear-gradient(
      135deg,
      var(--satria-primary),
      var(--satria-secondary)
    );

  color: white;

  box-shadow:
    0 8px 30px
    rgba(11,61,46,.14);

}


.brand-mini {

  display: flex;

  align-items: center;

  gap: 12px;

}


.brand-icon {

  width: 42px;

  height: 42px;

  border-radius: 12px;

  display: flex;

  align-items: center;

  justify-content: center;

  background:
    rgba(255,255,255,.14);

  font-size: 20px;

}


.brand-title {

  font-size: 17px;

  font-weight: 800;

  letter-spacing: .4px;

}


.brand-subtitle {

  font-size: 10px;

  opacity: .72;

}


.system-version {

  font-size: 11px;

  opacity: .72;

}


/* =========================================================
   MAIN
   ========================================================= */

.main-wrapper {

  width: 100%;

  max-width: 920px;

  margin: 0 auto;

  padding:
    55px 20px;

  flex: 1;

}


/* =========================================================
   SELECTOR CARD
   ========================================================= */

.selector-card {

  max-width: 520px;

  margin: 40px auto;

  padding: 36px;

  background: white;

  border:
    1px solid var(--satria-border);

  border-radius: 24px;

  box-shadow:
    0 18px 50px
    rgba(11,61,46,.09);

}


.selector-icon {

  width: 62px;

  height: 62px;

  border-radius: 18px;

  display: flex;

  align-items: center;

  justify-content: center;

  background:
    linear-gradient(
      135deg,
      var(--satria-primary),
      var(--satria-secondary)
    );

  color: white;

  font-size: 26px;

  margin-bottom: 20px;

}


.selector-card h1 {

  margin: 0;

  font-size: 25px;

  font-weight: 800;

}


.selector-description {

  margin:
    10px 0 28px;

  color: var(--satria-muted);

  font-size: 13px;

  line-height: 1.7;

}


/* =========================================================
   FORM
   ========================================================= */

.form-label {

  font-size: 12px;

  font-weight: 700;

  margin-bottom: 7px;

}


.input-wrapper {

  position: relative;

}


.input-wrapper i {

  position: absolute;

  left: 15px;

  top: 50%;

  transform:
    translateY(-50%);

  color:
    var(--satria-secondary);

}


.input-wrapper input {

  height: 50px;

  border-radius: 13px;

  padding-left: 42px;

  border:
    1px solid #DCE7E0;

  font-size: 14px;

  font-weight: 600;

}


.input-wrapper input:focus {

  border-color:
    var(--satria-secondary);

  box-shadow:
    0 0 0 4px
    rgba(46,125,50,.09);

}


.form-hint {

  font-size: 10px;

  color:
    var(--satria-muted);

  margin-top: 6px;

}


/* =========================================================
   BUTTON
   ========================================================= */

.btn-satria {

  width: 100%;

  height: 50px;

  margin-top: 22px;

  border: 0;

  border-radius: 13px;

  color: white;

  font-weight: 700;

  font-size: 13px;

  background:
    linear-gradient(
      135deg,
      var(--satria-primary),
      var(--satria-secondary)
    );

  box-shadow:
    0 10px 25px
    rgba(11,61,46,.18);

  transition:
    .2s ease;

}


.btn-satria:hover {

  transform:
    translateY(-1px);

  box-shadow:
    0 14px 30px
    rgba(11,61,46,.23);

}


/* =========================================================
   CONTEXT CARD
   ========================================================= */

.context-card {

  margin-top: 20px;

  overflow: hidden;

  background: white;

  border:
    1px solid var(--satria-border);

  border-radius: 25px;

  box-shadow:
    0 18px 50px
    rgba(11,61,46,.09);

}


.context-header {

  padding: 25px;

  display: flex;

  justify-content: space-between;

  align-items: center;

  gap: 20px;

  color: white;

  background:
    linear-gradient(
      135deg,
      var(--satria-primary),
      var(--satria-secondary)
    );

}


.school-identity {

  display: flex;

  align-items: center;

  gap: 15px;

}


.school-logo-wrapper {

  width: 62px;

  height: 62px;

  position: relative;

}


.school-logo,
.school-logo-fallback {

  width: 62px;

  height: 62px;

  border-radius: 17px;

  object-fit: contain;

  background: white;

}


.school-logo-fallback {

  display: flex;

  align-items: center;

  justify-content: center;

  color:
    var(--satria-primary);

  font-size: 25px;

}


.school-logo {

  display: none;

}


.school-name {

  font-size: 19px;

  font-weight: 800;

}


.school-npsn {

  margin-top: 2px;

  font-size: 11px;

  opacity: .78;

}


.school-tagline {

  margin-top: 5px;

  font-size: 11px;

  opacity: .72;

}


.status-badge {

  padding:
    7px 12px;

  border-radius: 30px;

  background:
    rgba(255,255,255,.15);

  border:
    1px solid
    rgba(255,255,255,.2);

  font-size: 10px;

  font-weight: 800;

}


/* =========================================================
   CONTEXT BODY
   ========================================================= */

.context-body {

  padding: 25px;

}


.context-title {

  font-size: 13px;

  font-weight: 800;

  color:
    var(--satria-primary);

  margin-bottom: 16px;

}


.context-title i {

  margin-right: 6px;

}


/* =========================================================
   GRID
   ========================================================= */

.context-grid {

  display: grid;

  grid-template-columns:
    repeat(2, 1fr);

  gap: 12px;

}


.info-card {

  display: flex;

  align-items: center;

  gap: 12px;

  padding: 15px;

  border:
    1px solid var(--satria-border);

  border-radius: 16px;

  background:
    #FAFCFA;

}


.info-icon {

  width: 38px;

  height: 38px;

  border-radius: 11px;

  display: flex;

  align-items: center;

  justify-content: center;

  background:
    #E9F4EC;

  color:
    var(--satria-secondary);

}


.info-label {

  font-size: 10px;

  color:
    var(--satria-muted);

}


.info-value {

  margin-top: 3px;

  font-size: 12px;

  font-weight: 700;

}


/* =========================================================
   CONNECTION
   ========================================================= */

.connection-result {

  display: flex;

  align-items: center;

  gap: 12px;

  margin-top: 18px;

  padding: 16px;

  border-radius: 15px;

  background:
    #EFF8F1;

  border:
    1px solid #D5EBD9;

}


.connection-icon {

  width: 38px;

  height: 38px;

  border-radius: 50%;

  display: flex;

  align-items: center;

  justify-content: center;

  background:
    #DDF0E0;

  color:
    var(--satria-secondary);

}


.connection-title {

  font-size: 12px;

  font-weight: 800;

}


.connection-description {

  margin-top: 3px;

  font-size: 10px;

  color:
    var(--satria-muted);

}


/* =========================================================
   CHANGE SCHOOL
   ========================================================= */

.btn-change-school {

  border: 0;

  background: transparent;

  color:
    var(--satria-secondary);

  font-size: 11px;

  font-weight: 700;

  padding: 14px 0 0;

}


.btn-change-school:hover {

  text-decoration: underline;

}


/* =========================================================
   FOOTER
   ========================================================= */

.footer {

  padding:
    18px 25px;

  display: flex;

  justify-content: space-between;

  color:
    #84928A;

  font-size: 9px;

}


/* =========================================================
   MOBILE
   ========================================================= */

@media (
  max-width: 600px
) {

  .topbar {

    padding:
      0 16px;

  }


  .system-version {

    display: none;

  }


  .main-wrapper {

    padding:
      25px 14px;

  }


  .selector-card {

    margin:
      15px auto;

    padding: 25px;

    border-radius: 20px;

  }


  .selector-card h1 {

    font-size: 21px;

  }


  .context-header {

    align-items: flex-start;

    flex-direction: column;

  }


  .context-grid {

    grid-template-columns: 1fr;

  }


  .footer {

    padding:
      15px;

  }

}

</style>

<script>
function menuKoneksi() {
  const content =
    document.getElementById(
      'content'
    );
  if (!content) {
    console.error(
      'Element #content tidak ditemukan.'
    );
    return;
  }
  /*
   * =====================================================
   * LOADING
   * =====================================================
   */
  content.innerHTML = `
    <div
      class="d-flex
             flex-column
             align-items-center
             justify-content-center"
      style="
        min-height:300px;
        color:#607D8B;
      ">
      <div
        class="spinner-border"
        role="status">
      </div>
      <div
        class="mt-3"
        style="font-size:.8rem;">
        Memuat Koneksi SIM SATRIA...
      </div>
    </div>
  `;
  /*
   * =====================================================
   * REQUEST HALAMAN
   * =====================================================
   */
  google.script.run
    .withSuccessHandler(
      function(view) {
        console.log(
          'Koneksi view diterima:',
          view
        );
        if (
          !view ||
          !view.success ||
          !view.html
        ) {
          content.innerHTML = `
            <div class="alert alert-danger m-3">
              <strong>
                Halaman Koneksi gagal dimuat.
              </strong>
            </div>
          `;
          return;
        }
        /*
         * =================================================
         * MASUKKAN HTML
         * =================================================
         */
        content.innerHTML =
          view.html;
        /*
         * =================================================
         * EKSEKUSI JAVASCRIPT
         * =================================================
         */
        if (
          view.js &&
          view.js.trim()
        ) {
          try {
            const script =
              document.createElement(
                'script'
              );
            script.type =
              'text/javascript';
            script.textContent =
              view.js;
            document
              .body
              .appendChild(
                script
              );
            console.log(
              'koneksi_js berhasil dieksekusi.'
            );
          }
          catch (error) {
            console.error(
              'Gagal menjalankan koneksi_js:',
              error
            );
            content.innerHTML += `
              <div class="alert alert-danger m-3">
                <strong>
                  JavaScript Koneksi gagal dijalankan.
                </strong>
                <div class="mt-2">
                  ${error.message}
                </div>
              </div>
            `;
          }
        }
      }
    )
    .withFailureHandler(
      function(error) {
        console.error(
          'getKoneksiView ERROR:',
          error
        );
        content.innerHTML = `
          <div class="alert alert-danger m-3">
            <strong>
              Gagal memuat halaman Koneksi
            </strong>
            <div class="mt-2">
              ${
                error &&
                error.message
                  ? error.message
                  : 'Terjadi kesalahan pada server.'
              }
            </div>
          </div>
        `;
      }
    )
    .getKoneksiView();
}
</script>

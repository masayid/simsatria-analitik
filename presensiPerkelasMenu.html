<script>
function menuPresensiPerkelas() {
  const content =
    document.getElementById(
      'content'
    );
  if (!content) return;
  content.innerHTML = `
    <div
      class="d-flex
             flex-column
             align-items-center
             justify-content-center"
      style="min-height:300px;">
      <div class="spinner-border"></div>
      <div class="mt-3 text-muted">
        Memuat Presensi Per Kelas...
      </div>
    </div>
  `;
  google.script.run
    .withSuccessHandler(
      function(view) {
        if (
          !view ||
          !view.success ||
          !view.html
        ) {
          content.innerHTML = `
            <div class="alert alert-danger">
              Presensi Per Kelas gagal dimuat.
            </div>
          `;
          return;
        }
        content.innerHTML =
          view.html;
        if (
          view.js &&
          view.js.trim()
        ) {
          const script =
            document.createElement(
              'script'
            );
          script.type =
            'text/javascript';
          script.textContent =
            view.js;
          document.body.appendChild(
            script
          );
        }
      }
    )
    .withFailureHandler(
      function(error) {
        content.innerHTML = `
          <div class="alert alert-danger">
            ${PP_escape(
              error &&
              error.message
                ? error.message
                : 'Presensi gagal dimuat.'
            )}
          </div>
        `;
      }
    )
    .getPresensiPerkelasView();
}
</script>
